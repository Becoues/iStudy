services:
  istudy:
    build: .
    container_name: istudy
    ports:
      - "3002:3000"
    volumes:
      - ./data:/app/data
      - ./public/images/knowledge:/app/public/images/knowledge
      - /Users/mac/Documents/Main/AI_talking:/Users/mac/Documents/Main/AI_talking
    restart: unless-stopped
